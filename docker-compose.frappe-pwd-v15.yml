# ERP v1 D7 — disposable ERPNext v15.122.0 stack (adapted from frappe_docker pwd.yml)
# Local-only demo. Admin: Administrator / admin  Site: frontend  Port: 8080
services:
  backend:
    image: frappe/erpnext:v15.122.0
    networks: [frappe_network]
    restart: unless-stopped
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
      - /workspace/proto-bot/erpnext/erp_fulfillment:/home/frappe/frappe-bench/apps/erp_fulfillment
      - /workspace/proto-bot/erpnext/fixtures:/home/frappe/frappe-bench/fixtures-erp-v1
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      MYSQL_ROOT_PASSWORD: admin
      MARIADB_ROOT_PASSWORD: admin
    depends_on:
      configurator:
        condition: service_completed_successfully

  configurator:
    image: frappe/erpnext:v15.122.0
    networks: [frappe_network]
    restart: "no"
    entrypoint: [bash, -c]
    command:
      - >
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host $$DB_HOST;
        bench set-config -gp db_port $$DB_PORT;
        bench set-config -g redis_cache "redis://$$REDIS_CACHE";
        bench set-config -g redis_queue "redis://$$REDIS_QUEUE";
        bench set-config -g redis_socketio "redis://$$REDIS_QUEUE";
        bench set-config -gp socketio_port $$SOCKETIO_PORT;
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
      SOCKETIO_PORT: "9000"
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
      - /workspace/proto-bot/erpnext/erp_fulfillment:/home/frappe/frappe-bench/apps/erp_fulfillment
      - /workspace/proto-bot/erpnext/fixtures:/home/frappe/frappe-bench/fixtures-erp-v1

  create-site:
    image: frappe/erpnext:v15.122.0
    networks: [frappe_network]
    restart: "no"
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
      - /workspace/proto-bot/erpnext/erp_fulfillment:/home/frappe/frappe-bench/apps/erp_fulfillment
      - /workspace/proto-bot/erpnext/fixtures:/home/frappe/frappe-bench/fixtures-erp-v1
    entrypoint: [bash, -c]
    command:
      - >
        wait-for-it -t 180 db:3306;
        wait-for-it -t 120 redis-cache:6379;
        wait-for-it -t 120 redis-queue:6379;
        export start=`date +%s`;
        until [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".db_host // empty"` ]] && \
              [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_cache // empty"` ]] && \
              [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_queue // empty"` ]];
        do
          echo "Waiting for sites/common_site_config.json";
          sleep 5;
          if (( `date +%s`-start > 180 )); then
            echo "could not find common_site_config.json";
            exit 1;
          fi;
        done;
        echo "common_site_config.json found";
        if [ -d "sites/frontend" ]; then
          echo "Site frontend already exists, skipping";
        else
          bench new-site --mariadb-user-host-login-scope='%' --admin-password=admin --db-root-username=root --db-root-password=admin --install-app erpnext --set-default frontend;
        fi;

  db:
    image: mariadb:10.6
    networks: [frappe_network]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 10s
      interval: 5s
      timeout: 5s
      retries: 12
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MARIADB_ROOT_PASSWORD: admin
    volumes:
      - db-data:/var/lib/mysql

  frontend:
    image: frappe/erpnext:v15.122.0
    networks: [frappe_network]
    depends_on: [websocket, backend]
    restart: unless-stopped
    command: [nginx-entrypoint.sh]
    environment:
      BACKEND: backend:8000
      FRAPPE_SITE_NAME_HEADER: frontend
      SOCKETIO: websocket:9000
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: 120
      CLIENT_MAX_BODY_SIZE: 50m
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
      - /workspace/proto-bot/erpnext/erp_fulfillment:/home/frappe/frappe-bench/apps/erp_fulfillment
      - /workspace/proto-bot/erpnext/fixtures:/home/frappe/frappe-bench/fixtures-erp-v1
    ports:
      - "8080:8080"

  queue-short:
    image: frappe/erpnext:v15.122.0
    networks: [frappe_network]
    restart: unless-stopped
    command:
      - bench
      - worker
      - --queue
      - short,default,long
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
      - /workspace/proto-bot/erpnext/erp_fulfillment:/home/frappe/frappe-bench/apps/erp_fulfillment
      - /workspace/proto-bot/erpnext/fixtures:/home/frappe/frappe-bench/fixtures-erp-v1
    environment:
      FRAPPE_REDIS_CACHE: redis://redis-cache:6379
      FRAPPE_REDIS_QUEUE: redis://redis-queue:6379
    depends_on:
      configurator:
        condition: service_completed_successfully

  redis-queue:
    image: redis:6.2-alpine
    networks: [frappe_network]
    restart: unless-stopped
    volumes:
      - redis-queue-data:/data

  redis-cache:
    image: redis:6.2-alpine
    networks: [frappe_network]
    restart: unless-stopped

  scheduler:
    image: frappe/erpnext:v15.122.0
    networks: [frappe_network]
    restart: unless-stopped
    command: [bench, schedule]
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
      - /workspace/proto-bot/erpnext/erp_fulfillment:/home/frappe/frappe-bench/apps/erp_fulfillment
      - /workspace/proto-bot/erpnext/fixtures:/home/frappe/frappe-bench/fixtures-erp-v1
    depends_on:
      configurator:
        condition: service_completed_successfully

  websocket:
    image: frappe/erpnext:v15.122.0
    networks: [frappe_network]
    restart: unless-stopped
    command: [node, /home/frappe/frappe-bench/apps/frappe/socketio.js]
    environment:
      FRAPPE_REDIS_CACHE: redis://redis-cache:6379
      FRAPPE_REDIS_QUEUE: redis://redis-queue:6379
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
      - /workspace/proto-bot/erpnext/erp_fulfillment:/home/frappe/frappe-bench/apps/erp_fulfillment
      - /workspace/proto-bot/erpnext/fixtures:/home/frappe/frappe-bench/fixtures-erp-v1
    depends_on:
      configurator:
        condition: service_completed_successfully

volumes:
  db-data:
  redis-queue-data:
  sites:
  logs:

networks:
  frappe_network:
    driver: bridge
